<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Viewport & Theme -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f2f5f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a1628" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />

  <!--
    Apply the stored theme before first paint. Without this the page renders
    light, then flips to dark once React mounts — a visible flash that the
    prerendered markup makes worse, because content paints before hydration.
  -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme')
        var dark = stored === 'dark' || ((!stored || stored === 'system') &&
          window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
      } catch (e) {
        document.documentElement.classList.add('light')
      }
    })()
  </script>

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <meta name="author" content="CFT Services" />

  <!--
    Page-specific head — title, description, robots, canonical, hreflang
    alternates, Open Graph, Twitter and JSON-LD — is generated per route by
    src/seo/head.ts and injected here by scripts/prerender.mjs.
  -->
  <!--app-head-->

  <!-- Fonts — one request for both families, so neither waits on the CSS bundle. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400..700&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
