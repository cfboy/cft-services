<!doctype html>

  <!-- Viewport & Theme -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f2f5f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a1628" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />

  <!--
    Apply the stored theme before first paint. Without this the page renders
    light, then flips to dark once React mounts — a visible flash that the
    prerendered markup makes worse, because content paints before hydration.
  -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme')
        var dark = stored === 'dark' || ((!stored || stored === 'system') &&
          window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
      } catch (e) {
        document.documentElement.classList.add('light')
      }
    })()
  </script>
